id = "drovr"
name = "Drovr"
version = "0.4.2"
min_herdr_version = "0.7.4"
description = "Drive your herd: move the focused tab or pane, live agents included, anywhere with an fzf picker."
platforms = ["linux", "macos"]

# Headless; invoked by keybindings (see README).
[[actions]]
id = "move-tab"
title = "Move tab to workspace…"
contexts = ["tab"]
command = ["node", "open-picker.ts", "tab"]

[[actions]]
id = "move-pane"
title = "Move pane to tab…"
contexts = ["pane"]
command = ["node", "open-picker.ts", "pane"]

# Defaults only; open-picker.ts sizes each open to fit its list.
[[panes]]
id = "picker"
title = "Drovr"
placement = "popup"
width = 64
height = 18
command = ["node", "pick-and-move.ts"]
