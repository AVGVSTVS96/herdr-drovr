id = "tab-mover"
name = "Tab Mover"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Move the focused tab, split layout and live agents included, to another workspace, picked with fzf."
platforms = ["linux", "macos"]

# Headless; invoked by a keybinding (see README).
[[actions]]
id = "move-tab"
title = "Move tab to workspace…"
contexts = ["tab"]
command = ["node", "capture-and-open.ts"]

# Plugin v1 has no native UI, so the picker is an overlay terminal pane.
[[panes]]
id = "picker"
title = "Move tab to workspace"
placement = "overlay"
command = ["node", "pick-and-move.ts"]
