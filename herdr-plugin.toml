id = "drovr"
name = "Drovr"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Drive your herd: move the focused tab or pane, live agents included, anywhere with an fzf picker."
platforms = ["linux", "macos"]

# Headless; invoked by keybindings (see README).
[[actions]]
id = "move-tab"
title = "Move tab to workspace…"
contexts = ["tab"]
command = ["node", "capture-and-open.ts", "tab"]

[[actions]]
id = "move-pane"
title = "Move pane to tab…"
contexts = ["pane"]
command = ["node", "capture-and-open.ts", "pane"]

# Manifest declares the overlay fallback; capture-and-open upgrades the open
# request to a floating popup on herdr >= 0.7.4.
[[panes]]
id = "picker"
title = "Drovr"
placement = "overlay"
command = ["node", "pick-and-move.ts"]
